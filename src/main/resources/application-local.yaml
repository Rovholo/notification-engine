logging:
  level:
    com:
      bitkulcha:
        notification_engine: DEBUG

spring:
  mail:
    host: localhost

firebase:
  credential: ${FIREBASE_CREDENTIAL:firebase-adminsdk.json}
  web-api-key: ${FIREBASE_WEB_API_KEY:}

mqtt:
  broker-name: test

jwt:
  secret: local-development-only-secret-key-0123456789-change-me
  expiration-minutes: 15
  refresh-expiration-days: 30

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: Auth API
        url: /swagger/authApi.yaml
      - name: Broker API
        url: /swagger/brokerApi.yaml
      - name: HomeQ API
        url: /swagger/homeQApi.yaml
      - name: Notifications API
        url: /swagger/notificationsApi.yaml
