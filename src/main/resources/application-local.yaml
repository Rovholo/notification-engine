logging:
  level:
    com:
      bitkulcha:
        notification_engine: DEBUG

spring:
#  datasource:
#    url: jdbc:h2:mem:testdb;MODE=MariaDB;DB_CLOSE_DELAY=-1
#    username: sa
#    password:
#    driver-class-name: org.h2.Driver
#  # Unused locally: LoggingEmailService writes reset codes to the log instead of sending email.
  mail:
    host: localhost

firebase:
  credential: ${FIREBASE_CREDENTIAL:firebase-adminsdk.json}

mqtt:
  broker-name: test

jwt:
  secret: local-development-only-secret-key-0123456789-change-me
  expiration-minutes: 15
  refresh-expiration-days: 30

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: Auth API
        url: /swagger/authApi.yaml
      - name: Broker API
        url: /swagger/brokerApi.yaml
      - name: HomeQ API
        url: /swagger/homeQApi.yaml
      - name: Notifications API
        url: /swagger/notificationsApi.yaml
