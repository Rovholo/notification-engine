openapi: 3.0.3
info:
  title: Broker Api
  version: 1.0.0

servers:
  - url: /api

paths:
  /broker:
    get:
      summary: Get an MQTT broker by name, or the default broker set by mqtt.broker-name when no name is given
      description: Names are not unique; if several brokers share a name the oldest is returned.
      operationId: getBroker
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broker'
        '404':
          description: No broker with that name

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Broker:
      type: object
      required:
        - id
        - name
        - server
        - username
        - password
        - secure
      properties:
        id:
          type: string
        name:
          type: string
          example: "main"
        server:
          type: string
          example: "broker.example.com"
        username:
          type: string
        password:
          type: string
        secure:
          type: boolean
