openapi: 3.0.3
info:
  title: HomeQ Api
  version: 1.0.0

servers:
  - url: /api

paths:
  /homeq/houses:
    get:
      summary: Get the houses the authenticated user owns or lives in
      operationId: getMyHouses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseDetails'
    post:
      summary: Create a house owned by the authenticated user
      operationId: createHouse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseDetails'
        '400':
          description: Invalid request body

  /homeq/houses/{houseId}/devices:
    post:
      summary: Add a device to a house the authenticated user owns
      operationId: addDevice
      security:
        - bearerAuth: []
      parameters:
        - name: houseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Invalid request body or house id
        '403':
          description: The user lives in the house but is not an owner
        '404':
          description: No such house, or the user is not a member of it


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    HouseDetails:
      type: object
      required:
        - id
        - name
        - owners
        - residents
        - devices
      properties:
        id:
          type: string
        name:
          type: string
          example: "Greenwood Manor"
        owners:
          type: array
          items:
            $ref: '#/components/schemas/HouseMember'
        residents:
          type: array
          items:
            $ref: '#/components/schemas/HouseMember'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    HouseMember:
      type: object
      required:
        - id
        - name
        - surname
        - email
      properties:
        id:
          type: string
        name:
          type: string
          example: "Alice"
        surname:
          type: string
          example: "Smith"
        email:
          type: string
          example: "alice@example.com"

    Device:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
        name:
          type: string
          example: "Front garage"
        type:
          $ref: '#/components/schemas/DeviceType'
        status:
          type: string
          example: "closed"

    DeviceType:
      type: string
      enum: [GARAGE_DOOR, LIGHT, AIR_CON, SENSOR]

    CreateHouseRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          example: "Greenwood Manor"

    CreateDeviceRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          example: "Front garage"
        type:
          $ref: '#/components/schemas/DeviceType'
        status:
          type: string
          maxLength: 50
          example: "closed"
