openapi: 3.0.3
info:
  title: HomeQ Api
  version: 1.0.0

servers:
  - url: /api

paths:
  /homeq/houses:
    get:
      summary: Get the houses the authenticated user owns or lives in
      operationId: getMyHouses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseDetails'
    post:
      summary: Create a house owned by the authenticated user
      operationId: createHouse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseDetails'
        '400':
          description: Invalid request body

  /homeq/houses/{houseId}/devices:
    post:
      summary: Add a device to a house the authenticated user owns
      operationId: addDevice
      security:
        - bearerAuth: []
      parameters:
        - name: houseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Invalid request body or house id, or the device id is not a UUIDv7
        '403':
          description: The user lives in the house but is not an owner
        '404':
          description: No such house, or the user is not a member of it
        '409':
          description: The device id is already used by a device in another house

  /homeq/houses/{houseId}/devices/{deviceId}:
    put:
      summary: Update a device in a house the authenticated user owns
      operationId: updateDevice
      security:
        - bearerAuth: []
      parameters:
        - name: houseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Invalid request body, house id or device id
        '403':
          description: The user lives in the house but is not an owner
        '404':
          description: No such house or device, or the user is not a member of the house

  /homeq/houses/{houseId}/devices/{deviceId}/secret:
    post:
      summary: Give a device that has no secret yet one, or get the one it already has
      description: >
        For devices set up before they had a secret, so the app can send one to the device on the local network.
        Every owner's app gets the same secret, whichever asked first.
      operationId: claimDeviceSecret
      security:
        - bearerAuth: []
      parameters:
        - name: houseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimDeviceSecretRequest'
      responses:
        '200':
          description: The device, with the secret it has now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Invalid request body, house id or device id
        '403':
          description: The user lives in the house but is not an owner
        '404':
          description: No such house or device, or the user is not a member of the house


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    HouseDetails:
      type: object
      required:
        - id
        - name
        - owners
        - residents
        - devices
      properties:
        id:
          type: string
        name:
          type: string
          example: "Greenwood Manor"
        owners:
          type: array
          items:
            $ref: '#/components/schemas/HouseMember'
        residents:
          type: array
          items:
            $ref: '#/components/schemas/HouseMember'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    HouseMember:
      type: object
      required:
        - id
        - name
        - surname
        - email
      properties:
        id:
          type: string
        name:
          type: string
          example: "Alice"
        surname:
          type: string
          example: "Smith"
        email:
          type: string
          example: "alice@example.com"

    Device:
      type: object
      required:
        - id
        - name
        - type
        - setupStatus
      properties:
        id:
          type: string
        name:
          type: string
          example: "Front garage"
        type:
          $ref: '#/components/schemas/DeviceType'
        status:
          type: string
          example: "closed"
        setupStatus:
          $ref: '#/components/schemas/DeviceSetupStatus'
        secret:
          type: string
          description: >
            The key the app signs local network requests to the device with. Only house members get it.

    DeviceType:
      type: string
      enum: [GARAGE_DOOR, LIGHT, AIR_CON, SENSOR]

    DeviceSetupStatus:
      type: string
      description: >
        Where the device is in its setup lifecycle, separate from its live status.
        ADDED devices haven't received their wifi/broker details yet; only ACTIVE devices are used over MQTT.
      enum: [ADDED, ACTIVE, INACTIVE]

    CreateHouseRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          example: "Greenwood Manor"

    CreateDeviceRequest:
      type: object
      required:
        - name
        - type
      properties:
        id:
          type: string
          format: uuid
          description: >
            Optional UUIDv7 chosen by the app, so it can configure the device before it is back online.
            Retrying with the same id updates and returns the device instead of adding another.
            The server picks one when it is omitted.
          example: "01920c2e-7b5a-7cc4-9f3e-2d6a1b8e4f10"
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          example: "Front garage"
        type:
          $ref: '#/components/schemas/DeviceType'
        status:
          type: string
          maxLength: 50
          example: "closed"
        setupStatus:
          $ref: '#/components/schemas/DeviceSetupStatus'
        secret:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            The key the app gave the device during setup, as 64 hex characters, so members can sign local network
            requests to it. Leaving it out keeps the current one.

    ClaimDeviceSecretRequest:
      type: object
      required:
        - secret
      properties:
        secret:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The secret to give the device, as 64 hex characters, if it has none yet.

    UpdateDeviceRequest:
      type: object
      required:
        - name
        - type
        - setupStatus
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          example: "Front garage"
        type:
          $ref: '#/components/schemas/DeviceType'
        setupStatus:
          $ref: '#/components/schemas/DeviceSetupStatus'
