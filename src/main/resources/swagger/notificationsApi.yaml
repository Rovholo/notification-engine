openapi: 3.0.3
info:
  title: Notifications Api
  version: 1.0.0

servers:
  - url: /api

paths:
  /notification:
    post:
      summary: Send a notification
      description: Requires an access token for a user with the ADMIN role.
      operationId: sendMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRequest'
        '401':
          description: Missing or invalid access token
        '403':
          description: The user does not have the ADMIN role

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    NotificationRequest:
      type: object
      properties:
        type:
          type: string
          description: Type of message to be sent
          enum:
            - PUSH
            - MQTT
            - EMAIL
        message:
          type: object
          description: >
            Depends on type. PUSH: {topic, notification: {title, body}}.
            EMAIL: {to: [addresses], subject, body}.
      required:
        - type
        - message