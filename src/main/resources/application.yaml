server:
  servlet:
    context-path: /api

logging:
  level:
    com:
      bitkulcha:
        notification_engine: ${LOG_LEVEL:INFO}

spring:
  application:
    name: notification-engine
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      # Port 465 expects TLS from the first byte: set MAIL_SMTP_SSL=true and MAIL_SMTP_STARTTLS=false for it.
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      # Prints the whole SMTP conversation, including what the server replies after accepting a message.
      mail.debug: ${MAIL_DEBUG:false}

mail:
  from: ${MAIL_FROM}

firebase:
  credential: ${FIREBASE_CREDENTIAL}
  # Web API key from Firebase project settings, used to check passwords of users still on Firebase Auth.
  web-api-key: ${FIREBASE_WEB_API_KEY:}

mqtt:
  broker-name: ${BROKER_NAME}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

# API docs are off unless a profile opts in (see application-local.yaml), so prod never exposes them.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
