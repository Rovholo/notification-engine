server:
  servlet:
    context-path: /api
  forward-headers-strategy: framework
  shutdown: graceful

logging:
  level:
    com:
      bitkulcha:
        notification_engine: ${LOG_LEVEL:INFO}

spring:
  application:
    name: notification-engine
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      mail.debug: ${MAIL_DEBUG:false}

mail:
  from: ${MAIL_FROM}

firebase:
  credential: ${FIREBASE_CREDENTIAL}
  web-api-key: ${FIREBASE_WEB_API_KEY:}

mqtt:
  broker-name: ${BROKER_NAME}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
